<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>我的媒体工具</title>
<link rel="manifest" href="/static/manifest.json">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#111827;background:#f5f5f7}
*{box-sizing:border-box}body{margin:0;padding:18px 14px 36px}main{max-width:680px;margin:auto}
.card{background:white;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 4px 18px #0000000d}
h1{font-size:27px;margin:8px 0 5px}.sub{color:#6b7280;font-size:14px;margin-bottom:18px}
label{display:block;font-weight:650;margin:12px 0 7px}input,button,select{font:inherit}
input[type=file],input[type=text],input[type=number],select{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:12px;background:#fff}
button{width:100%;border:0;border-radius:13px;padding:14px;margin-top:14px;background:#111827;color:white;font-weight:700}
button:disabled{opacity:.45}.mode{display:grid;grid-template-columns:1fr 1fr;gap:9px}.mode button{margin:0;background:#e5e7eb;color:#111827}.mode button.active{background:#111827;color:white}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.help{font-size:13px;color:#6b7280;line-height:1.5}
#preview{width:100%;max-height:420px;object-fit:contain;border-radius:14px;background:#111;margin-top:12px;display:none}
#status{margin-top:14px;font-size:14px;white-space:pre-wrap}.ok{color:#047857}.err{color:#b91c1c}
.badge{display:inline-block;background:#eef2ff;padding:5px 9px;border-radius:99px;font-size:12px}
</style>
</head>
<body>
<main>
  <div class="card">
    <span class="badge">个人版 · v1</span>
    <h1>我的媒体工具</h1>
    <div class="sub">图片 / 视频加水印、固定区域去水印。文件处理后自动删除。</div>

    <label>选择文件</label>
    <input id="file" type="file" accept="image/*,video/*">
    <img id="preview" alt="预览">

    <label>操作</label>
    <div class="mode">
      <button id="addBtn" class="active" type="button">添加水印</button>
      <button id="removeBtn" type="button">去水印</button>
    </div>

    <div id="addPanel">
      <label>水印文字</label>
      <input id="text" type="text" value="My Watermark" maxlength="80" placeholder="输入水印文字">
      <div class="row">
        <div><label>X</label><input id="addX" type="number" value="20" min="0"></div>
        <div><label>Y</label><input id="addY" type="number" value="20" min="0"></div>
      </div>
    </div>

    <div id="removePanel" style="display:none">
      <label>去水印区域</label>
      <div class="row">
        <div><label>X</label><input id="x" type="number" value="0" min="0"></div>
        <div><label>Y</label><input id="y" type="number" value="0" min="0"></div>
        <div><label>宽度</label><input id="w" type="number" value="200" min="1"></div>
        <div><label>高度</label><input id="h" type="number" value="80" min="1"></div>
      </div>
      <p class="help">第一版采用固定矩形修复。视频中的水印如果会移动，第一版暂不自动跟踪。</p>
    </div>

    <button id="go" type="button">开始处理</button>
    <div id="status"></div>
  </div>

  <div class="card help">
    <b>iPhone 使用：</b>Safari 打开后点“分享”→“添加到主屏幕”，以后可像 App 一样直接打开。
    <br><br>
    文件默认不保存到服务器：处理完成后响应结束会清理本次任务文件。
  </div>
</main>

<script>
const fileEl=document.querySelector("#file"), preview=document.querySelector("#preview");
const addBtn=document.querySelector("#addBtn"), removeBtn=document.querySelector("#removeBtn");
const addPanel=document.querySelector("#addPanel"), removePanel=document.querySelector("#removePanel");
const statusEl=document.querySelector("#status"), go=document.querySelector("#go");

let mode="add";
addBtn.onclick=()=>{mode="add";addBtn.classList.add("active");removeBtn.classList.remove("active");addPanel.style.display="block";removePanel.style.display="none"};
removeBtn.onclick=()=>{mode="remove";removeBtn.classList.add("active");addBtn.classList.remove("active");addPanel.style.display="none";removePanel.style.display="block"};

fileEl.onchange=()=>{
  const f=fileEl.files[0]; if(!f)return;
  preview.style.display="none";
  if(f.type.startsWith("image/")){
    preview.src=URL.createObjectURL(f); preview.style.display="block";
  }
};

go.onclick=async()=>{
  const f=fileEl.files[0];
  if(!f){statusEl.className="err";statusEl.textContent="请先选择图片或视频。";return}
  const fd=new FormData();
  fd.append("file",f); fd.append("mode",mode);
  fd.append("text",document.querySelector("#text").value);
  if(mode==="add"){
    fd.append("x",document.querySelector("#addX").value);
    fd.append("y",document.querySelector("#addY").value);
    fd.append("w","100"); fd.append("h","100");
  }else{
    for(const id of ["x","y","w","h"])fd.append(id,document.querySelector("#"+id).value);
  }
  go.disabled=true; statusEl.className=""; statusEl.textContent="正在处理，请保持页面打开…";
  try{
    const r=await fetch("/process",{method:"POST",body:fd});
    if(!r.ok){let e={};try{e=await r.json()}catch{};throw new Error(e.error||("处理失败："+r.status))}
    const blob=await r.blob();
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=f.type.startsWith("video/")?"result.mp4":"result.jpg";
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
    statusEl.className="ok";statusEl.textContent="处理完成。iPhone 会将文件交给系统保存/分享。";
  }catch(e){statusEl.className="err";statusEl.textContent=e.message}
  finally{go.disabled=false}
};
</script>
</body>
</html>
